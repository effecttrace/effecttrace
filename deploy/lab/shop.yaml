          image: localhost/effecttrace/demo:dev
          imagePullPolicy: IfNotPresent
          command: ["/shopsim"]
          env:
            - { name: ROLE, value: loadgen }
            - { name: TARGET, value: "http://frontend:8080" }
            - { name: RPS, value: "25" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
