# Used by experiment L22: deleted and recreated with the same name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ephemeral
  namespace: shop
  labels: { app: ephemeral }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ephemeral }
  template:
    metadata:
      labels: { app: ephemeral }
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: localhost/effecttrace/demo:dev
          imagePullPolicy: IfNotPresent
          command: ["/shopsim"]
          env:
            - { name: ROLE, value: ephemeral }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 1
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
