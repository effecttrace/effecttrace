<title id="et-title">EffectTrace</title>
<desc id="et-desc">EffectTrace mark: a single action point on the left fans out into three observed effects. Two branches are solid lines (direct and structural evidence); the third is dotted (temporal correlation only) and ends in an open ring.</desc>
