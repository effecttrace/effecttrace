<text x="32" y="40" class="mono" font-size="10" fill="#086f79" font-weight="700" letter-spacing=".16em">EVIDENCE CLASSES</text>
<text x="32" y="66" class="sans" font-size="20" fill="#0d1726" font-weight="700" letter-spacing="-.01em">Every edge carries its evidence</text>
<text x="32" y="86" class="sans" font-size="12.5" fill="#4d5b6e">Classes come from identifiers and timestamps that were observed — never from guesses.</text>
<g class="" style="">
<rect x="70" y="122" width="798" height="58" rx="10" fill="#ffffff" stroke="#d3dbe7" />
<path d="M88 151.0 h52" stroke="#17782f" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="148" cy="151.0" r="4.5" fill="#17782f"/>
<text x="170" y="155.2" class="mono" font-size="12" fill="#17782f" font-weight="700">DIRECT</text>
<text x="340" y="141" class="sans" font-size="12.5" fill="#0d1726" font-weight="600">The tool’s own Kubernetes request changed the object.</text>
<text x="340" y="157" class="mono" font-size="9.5" fill="#4d5b6e">server Audit-ID echoed to the instrumented client + object UID/resourceVersion</text>
<text x="340" y="170" class="mono" font-size="9.5" fill="#4d5b6e">from the response · independently confirmed by the kube-apiserver audit event</text>
</g>
<g class="" style="">
<rect x="70" y="186" width="798" height="46" rx="10" fill="#ffffff" stroke="#d3dbe7" />
<path d="M88 209.0 h52" stroke="#0a5fc8" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="148" cy="209.0" r="4.5" fill="#0a5fc8"/>
<text x="170" y="213.2" class="mono" font-size="12" fill="#0a5fc8" font-weight="700">TRACE_LINK</text>
<text x="340" y="205" class="sans" font-size="12.5" fill="#0d1726" font-weight="600">The Kubernetes client span descends from the MCP tool span.</text>
<text x="340" y="221" class="mono" font-size="9.5" fill="#4d5b6e">OpenTelemetry parent/child · W3C traceparent propagated in MCP params._meta</text>
</g>
<g class="" style="">
<rect x="70" y="238" width="798" height="46" rx="10" fill="#ffffff" stroke="#d3dbe7" />
<path d="M88 261.0 h52" stroke="#086f79" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="148" cy="261.0" r="4.5" fill="#086f79"/>
<text x="170" y="265.2" class="mono" font-size="12" fill="#086f79" font-weight="700">STRUCTURAL</text>
<text x="340" y="257" class="sans" font-size="12.5" fill="#0d1726" font-weight="600">Controller ownership: Deployment owns ReplicaSet owns Pods.</text>
<text x="340" y="273" class="mono" font-size="9.5" fill="#4d5b6e">Kubernetes controller ownerReferences matched by UID</text>
</g>
<g class="" style="">
<rect x="70" y="290" width="798" height="46" rx="10" fill="#ffffff" stroke="#d3dbe7" />
<path d="M88 313.0 h52" stroke="#7a46d6" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="148" cy="313.0" r="4.5" fill="#7a46d6"/>
<text x="170" y="317.2" class="mono" font-size="12" fill="#7a46d6" font-weight="700">EVENT_REFERENCE</text>
<text x="340" y="309" class="sans" font-size="12.5" fill="#0d1726" font-weight="600">A Kubernetes Event references the object.</text>
<text x="340" y="325" class="mono" font-size="9.5" fill="#4d5b6e">the Event’s object reference is matched by UID</text>
</g>
<g class="" style="">
<rect x="70" y="372" width="798" height="46" rx="10" fill="#ffffff" stroke="#d3dbe7" />
<path d="M88 395.0 h52" stroke="#8a5a00" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="0.1 6.5" class=""/>
<circle cx="148" cy="395.0" r="4" fill="#ffffff" stroke="#8a5a00" stroke-width="2"/>
<text x="170" y="399.2" class="mono" font-size="12" fill="#8a5a00" font-weight="700">TEMPORAL_CORRELATION</text>
<text x="340" y="391" class="sans" font-size="12.5" fill="#0d1726" font-weight="600">A Prometheus signal changed inside the observation window.</text>
<text x="340" y="407" class="mono" font-size="9.5" fill="#4d5b6e">correlation only · never presented as causation</text>
</g>
