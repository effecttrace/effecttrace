<svg xmlns="http://www.w3.org/2000/svg" width="900" height="584" viewBox="0 0 900 584" role="img" aria-labelledby="evt-title evt-desc">
<title id="evt-title">EffectTrace evidence classes</title>
<desc id="evt-desc">Legend of EffectTrace evidence classes. Attributing classes, drawn as solid lines: DIRECT (green) - the tool's own Kubernetes request changed the object, verified by the server Audit-ID echoed to the client plus object UID and resourceVersion, confirmed by the kube-apiserver audit event; TRACE_LINK (blue) - the Kubernetes client span descends from the MCP tool span; STRUCTURAL (teal) - controller ownerReferences matched by UID; EVENT_REFERENCE (violet) - a Kubernetes Event references the object by UID. Correlating class, drawn dotted: TEMPORAL_CORRELATION (amber) - a Prometheus signal changed inside the observation window, correlation only. INFERRED is greyed out: defined in the model, not emitted in v0.1. Rule: a path is only as strong as its weakest edge - all attributing edges grade ATTRIBUTED, any temporal edge grades CORRELATED.</desc>
<style>
.sans{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.pre{white-space:pre}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
