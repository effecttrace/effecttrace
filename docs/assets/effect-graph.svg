<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="eg-title eg-desc">
<title id="eg-title">Anatomy of an effect graph</title>
<desc id="eg-desc">Anatomy of an EffectTrace effect graph. Left: an action node links by TRACE_LINK to a Kubernetes request, by DIRECT to Deployment shop/checkout, by STRUCTURAL to a ReplicaSet and Pods, by EVENT_REFERENCE to Events, and by a dotted TEMPORAL_CORRELATION edge to http_p99_latency. Right: one edge record with its relationship, evidence, source, rule and facts. Bottom: the graph sections - schemaVersion, action, nodes, edges, windows, exclusions, ambiguities, coverage and notes.</desc>
