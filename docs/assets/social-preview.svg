<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="et-title et-desc">
<title id="et-title">EffectTrace: Trace the effect, not just the call.</title>
<desc id="et-desc">Social preview card. EffectTrace logo, tagline &quot;Trace the effect, not just the call.&quot;, subtitle &quot;Open, evidence-graded observability from agent actions to Kubernetes effects.&quot; and a legend of the five evidence classes: DIRECT, TRACE_LINK, STRUCTURAL, EVENT_REFERENCE (solid lines) and TEMPORAL_CORRELATION (dotted line).</desc>
