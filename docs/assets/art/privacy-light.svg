<text x="450.0" y="480" class="mono" font-size="8.5" fill="#4d5b6e" font-weight="700" text-anchor="middle" letter-spacing=".1em">AUDIT AT METADATA LEVEL · OBJECTS CACHED WITHOUT SPEC/ENV · CONFIGMAPS &amp; SECRETS NEVER WATCHED</text>
