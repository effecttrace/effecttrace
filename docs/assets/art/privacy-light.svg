<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="pv-title pv-desc">
<title id="pv-title">EffectTrace privacy defaults</title>
<desc id="pv-desc">Privacy defaults. Kept as metadata: kind, namespace, name, UID, verb, timestamps, trace and span IDs, tool name. Never stored: prompts, tool arguments and results, Secret and ConfigMap contents, request bodies, tokens. Human usernames are pseudonymized; system identities are kept. The audit log is read at Metadata level, watched objects are cached without spec or env, and ConfigMaps and Secrets are never watched.</desc>
<style>
.sans{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.pre{white-space:pre}
@keyframes comet{0%{stroke-dashoffset:8;opacity:0}12%{opacity:1}88%{opacity:1}100%{stroke-dashoffset:-92;opacity:0}}
@keyframes dots{to{stroke-dashoffset:-18}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes halo{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes ring{0%{opacity:.55;transform:scale(.85)}80%,100%{opacity:0;transform:scale(1.55)}}
@keyframes popin{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.comet{stroke-dasharray:8 92;stroke-dashoffset:8;opacity:0;animation:comet 3.2s cubic-bezier(.45,.05,.55,.95) infinite}
.dots{animation:dots 1.4s linear infinite}
@keyframes dotsm{to{stroke-dashoffset:-14.82}}
.dots-mark{animation:dotsm 1.6s linear infinite}
.breathe{animation:breathe 3.6s ease-in-out infinite}
.halo{animation:halo 4.8s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}
.pop{transform-box:fill-box;animation:popin .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadein .5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.comet{opacity:0}}
</style>
<defs>
<pattern id="pv-grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#e2e8f1"/></pattern>
<linearGradient id="pv-bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f8"/><stop offset="1" stop-color="#f6f8fb"/></linearGradient>
<radialGradient id="pv-vig" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#086f79" stop-opacity=".06"/><stop offset="1" stop-color="#086f79" stop-opacity="0"/></radialGradient>
</defs>
<rect width="900" height="500" rx="16" fill="url(#pv-bgg)"/>
<rect width="900" height="500" rx="16" fill="url(#pv-grid)" opacity=".9"/>
<rect width="900" height="500" rx="16" fill="url(#pv-vig)"/>
<rect x=".5" y=".5" width="899" height="499" rx="15.5" fill="none" stroke="#d3dbe7"/>
<text x="28" y="40" class="mono" font-size="10" fill="#086f79" font-weight="700" letter-spacing=".16em">PRIVACY BY DEFAULT</text>
<text x="28" y="66" class="sans" font-size="20" fill="#0d1726" font-weight="700" letter-spacing="-.01em">Metadata, not payloads</text>
<text x="28" y="86" class="sans" font-size="12.5" fill="#4d5b6e">EffectTrace records what changed and how it knows — never what was said.</text>
<rect x="28" y="115" width="412" height="260" rx="14" fill="#1f2a3c" opacity=".07"/>
<rect x="28" y="112" width="412" height="260" rx="14" fill="#ffffff" stroke="#d3dbe7" />
<circle cx="54" cy="138" r="9" fill="#dae9de" stroke="#17782f"/>
<path d="M49.5 138 l3 3 l5.5 -6" fill="none" stroke="#17782f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="142" class="mono" font-size="10" fill="#17782f" font-weight="700" letter-spacing=".16em">KEPT · METADATA</text>
