<svg xmlns="http://www.w3.org/2000/svg" width="132" height="34" viewBox="0 0 132 34" role="img" aria-labelledby="et-title et-desc">
<title id="et-title">Star EffectTrace on GitHub</title>
<desc id="et-desc">A Star button inviting you to star the EffectTrace repository.</desc>
<style>.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.sans{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}
@keyframes fillstar{0%,55%{fill-opacity:0}65%,90%{fill-opacity:1}100%{fill-opacity:0}}
@keyframes spin{0%,55%{transform:scale(1)}62%{transform:scale(1.22)}70%,100%{transform:scale(1)}}
@keyframes sweep{0%,40%{transform:translateX(-60px)}75%,100%{transform:translateX(190px)}}
.st{transform-box:fill-box;transform-origin:center;animation:fillstar 5s ease-in-out infinite,spin 5s ease-in-out infinite}
.sw{animation:sweep 5s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.st{fill-opacity:1}}</style>
<defs><clipPath id="sc"><rect x="1" y="1" width="130" height="32" rx="9"/></clipPath><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#e6edf3" stop-opacity="0"/><stop offset=".5" stop-color="#e6edf3" stop-opacity=".10"/><stop offset="1" stop-color="#e6edf3" stop-opacity="0"/></linearGradient></defs>
<rect x=".75" y=".75" width="130.5" height="32.5" rx="9" fill="#121a27" stroke="#33445f" stroke-width="1.5"/>
<g clip-path="url(#sc)"><rect class="sw" x="0" y="0" width="50" height="34" fill="url(#sh)"/></g>
<path class="st" d="M28 8.6l2.7 5.5 6.05.88-4.38 4.27 1.03 6.03L28 22.43l-5.4 2.85 1.03-6.03-4.38-4.27 6.05-.88z" fill="#e3b341" fill-opacity="0" stroke="#e3b341" stroke-width="1.6" stroke-linejoin="round"/>
<text x="46" y="21.6" class="sans" font-size="13.5" font-weight="600" fill="#e6edf3">Star</text>
<line x1="86" y1="9" x2="86" y2="25" stroke="#33445f"/>
<g transform="translate(95 4) scale(0.4)">
<path d="M13 32 C 22 32 22.5 15 32 15 H 46" fill="none" stroke="#3fb950" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M13 32 H 46" fill="none" stroke="#39c5cf" stroke-width="4.6" stroke-linecap="round"/>
<path d="M13 32 C 22 32 22.5 49 32 49 H 46" fill="none" stroke="#d29922" stroke-width="4.6" stroke-linecap="round" stroke-dasharray="0.01 7.4" class=""/>
<circle cx="52" cy="15" r="5" fill="#3fb950"/>
<circle cx="52" cy="32" r="5" fill="#39c5cf"/>
<circle cx="52" cy="49" r="4" fill="none" stroke="#d29922" stroke-width="2.4"/>
<circle cx="13" cy="32" r="6.4" fill="#e6edf3"/>
</g>
</svg>
