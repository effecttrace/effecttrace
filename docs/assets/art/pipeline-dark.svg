<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="pl-title pl-desc">
<title id="pl-title">EffectTrace pipeline</title>
<desc id="pl-desc">EffectTrace architecture. Inputs: OpenTelemetry spans over OTLP/HTTP from the MCP agent and tool server via an OpenTelemetry Collector; the kube-apiserver audit log at Metadata level with no bodies; a Kubernetes watch through client-go informers for Deployments, ReplicaSets, StatefulSets, DaemonSets, Jobs, Pods, Services and Events with specs and env stripped before caching, never ConfigMaps or Secrets; and Prometheus range queries. Inside the EffectTrace collector: a bounded queue, an idempotent in-memory store and a deterministic correlation engine. Outputs: a read-only HTTP API under /api/v1, the effecttrace explain CLI, the canonical JSON effect graph, OTLP export of completed graphs as spans that link to the tool span, Prometheus /metrics, and JSON-lines recording for offline replay.</desc>
