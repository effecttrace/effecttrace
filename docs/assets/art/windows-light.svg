<text x="28" y="66" class="sans" font-size="20" fill="#0d1726" font-weight="700" letter-spacing="-.01em">When a change counts — and when it does not</text>
<text x="28" y="86" class="sans" font-size="12.5" fill="#4d5b6e">Windows are derived from the action itself, not from a fixed lookback.</text>
