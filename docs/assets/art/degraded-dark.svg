<text x="28" y="40" class="mono" font-size="10" fill="#39c5cf" font-weight="700" letter-spacing=".16em">COVERAGE UNDER MISSING SOURCES</text>
<text x="28" y="66" class="sans" font-size="20" fill="#e6edf3" font-weight="700" letter-spacing="-.01em">Missing data lowers coverage, never raises confidence.</text>
<text x="28" y="86" class="sans" font-size="12.5" fill="#9aa7b8">Every graph reports which sources were available. Gaps weaken grades; nothing fills them in.</text>
