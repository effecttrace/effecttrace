<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">EffectTrace: trace the effect, not just the call</title>
<desc id="hero-desc">Left to right. AGENT ACTS: an MCP tools/call restart_workload for shop/checkout, carrying trace context. EFFECTTRACE GRADES: the EffectTrace mark observes the action. KUBERNETES EFFECTS: a solid green DIRECT edge reaches Deployment shop/checkout (generation 3 to 4); solid teal STRUCTURAL edges reach the new ReplicaSet checkout-8554d95446 and its 3 Pods (3/3 ready); a dotted amber TEMPORAL edge reaches a p99 latency card (50ms to 149ms, correlation only). A grey card, Deployment shop/payments scaled by kubectl at the same time, stays disconnected and is tagged EXCLUDED. Footer: Evidence, not guesses. Correlation is not causation.</desc>
