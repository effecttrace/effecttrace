<text x="70" y="363" class="mono" font-size="9" fill="#d29922" font-weight="700" letter-spacing=".16em">CORRELATING</text>
<text x="155.438" y="363" class="mono" font-size="9" fill="#9aa7b8">timing only · not proof of cause</text>
