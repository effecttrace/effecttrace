<linearGradient id="ev-bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1522"/><stop offset="1" stop-color="#0b0f17"/></linearGradient>
<radialGradient id="ev-vig" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#39c5cf" stop-opacity=".10"/><stop offset="1" stop-color="#39c5cf" stop-opacity="0"/></radialGradient>
</defs>
