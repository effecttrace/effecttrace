<text x="32" y="40" class="mono" font-size="10" fill="#39c5cf" font-weight="700" letter-spacing=".16em">EVIDENCE CLASSES</text>
<text x="32" y="66" class="sans" font-size="20" fill="#e6edf3" font-weight="700" letter-spacing="-.01em">Every edge carries its evidence</text>
<text x="32" y="86" class="sans" font-size="12.5" fill="#9aa7b8">Classes come from identifiers and timestamps that were observed — never from guesses.</text>
<g class="pop" style="animation-delay:0.00s">
<rect x="70" y="122" width="798" height="58" rx="10" fill="#121a27" stroke="#27344b" />
<path d="M88 151.0 h52" stroke="#3fb950" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="148" cy="151.0" r="4.5" fill="#3fb950"/>
<text x="170" y="155.2" class="mono" font-size="12" fill="#3fb950" font-weight="700">DIRECT</text>
<text x="340" y="141" class="sans" font-size="12.5" fill="#e6edf3" font-weight="600">The tool’s own Kubernetes request changed the object.</text>
<text x="340" y="157" class="mono" font-size="9.5" fill="#9aa7b8">server Audit-ID echoed to the instrumented client + object UID/resourceVersion</text>
<text x="340" y="170" class="mono" font-size="9.5" fill="#9aa7b8">from the response · independently confirmed by the kube-apiserver audit event</text>
</g>
<g class="pop" style="animation-delay:0.15s">
<rect x="70" y="186" width="798" height="46" rx="10" fill="#121a27" stroke="#27344b" />
<path d="M88 209.0 h52" stroke="#58a6ff" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="148" cy="209.0" r="4.5" fill="#58a6ff"/>
<text x="170" y="213.2" class="mono" font-size="12" fill="#58a6ff" font-weight="700">TRACE_LINK</text>
<text x="340" y="205" class="sans" font-size="12.5" fill="#e6edf3" font-weight="600">The Kubernetes client span descends from the MCP tool span.</text>
<text x="340" y="221" class="mono" font-size="9.5" fill="#9aa7b8">OpenTelemetry parent/child · W3C traceparent propagated in MCP params._meta</text>
</g>
<g class="pop" style="animation-delay:0.30s">
<rect x="70" y="238" width="798" height="46" rx="10" fill="#121a27" stroke="#27344b" />
<path d="M88 261.0 h52" stroke="#39c5cf" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="148" cy="261.0" r="4.5" fill="#39c5cf"/>
<text x="170" y="265.2" class="mono" font-size="12" fill="#39c5cf" font-weight="700">STRUCTURAL</text>
<text x="340" y="257" class="sans" font-size="12.5" fill="#e6edf3" font-weight="600">Controller ownership: Deployment owns ReplicaSet owns Pods.</text>
<text x="340" y="273" class="mono" font-size="9.5" fill="#9aa7b8">Kubernetes controller ownerReferences matched by UID</text>
</g>
<g class="pop" style="animation-delay:0.45s">
<rect x="70" y="290" width="798" height="46" rx="10" fill="#121a27" stroke="#27344b" />
<path d="M88 313.0 h52" stroke="#a371f7" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="148" cy="313.0" r="4.5" fill="#a371f7"/>
<text x="170" y="317.2" class="mono" font-size="12" fill="#a371f7" font-weight="700">EVENT_REFERENCE</text>
<text x="340" y="309" class="sans" font-size="12.5" fill="#e6edf3" font-weight="600">A Kubernetes Event references the object.</text>
<text x="340" y="325" class="mono" font-size="9.5" fill="#9aa7b8">the Event’s object reference is matched by UID</text>
</g>
<g class="pop" style="animation-delay:0.60s">
<rect x="70" y="372" width="798" height="46" rx="10" fill="#121a27" stroke="#27344b" />
<path d="M88 395.0 h52" stroke="#d29922" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="0.1 6.5" class="dots"/>
<circle cx="148" cy="395.0" r="4" fill="#121a27" stroke="#d29922" stroke-width="2"/>
<text x="170" y="399.2" class="mono" font-size="12" fill="#d29922" font-weight="700">TEMPORAL_CORRELATION</text>
<text x="340" y="391" class="sans" font-size="12.5" fill="#e6edf3" font-weight="600">A Prometheus signal changed inside the observation window.</text>
<text x="340" y="407" class="mono" font-size="9.5" fill="#9aa7b8">correlation only · never presented as causation</text>
</g>
