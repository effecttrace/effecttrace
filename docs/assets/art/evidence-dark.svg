<text x="340" y="452" class="mono" font-size="9.5" fill="#848d97">reserved for experimental heuristics · not used in v0.1</text>
<path d="M50 126 V 332" stroke="#3fb950" stroke-width="2" stroke-linecap="round" opacity=".7"/>
<text x="70" y="113" class="mono" font-size="9" fill="#3fb950" font-weight="700" letter-spacing=".16em">ATTRIBUTING</text>
<text x="155.438" y="113" class="mono" font-size="9" fill="#9aa7b8">identifiers link the two nodes</text>
