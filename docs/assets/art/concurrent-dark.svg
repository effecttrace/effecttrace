<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="cc-title cc-desc">
<title id="cc-title">EffectTrace concurrent actions</title>
<desc id="cc-desc">Concurrent actions. Lane A: an agent calls restart_workload on shop/checkout; its graph keeps only Deployment shop/checkout, its ReplicaSet and Pods, and lists the payments change as excluded. Lane B: at the same moment a human runs kubectl scale on shop/payments, seen in the audit log with a pseudonymized user; its graph keeps only the payments Deployment, ReplicaSet and Pods. No edge crosses between the lanes. Bottom panel: two actions on the same workload; changes before the second request are attributed to the first action, while changes inside both actions' windows after the second request are AMBIGUOUS and attributed to neither.</desc>
<style>
.sans{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.pre{white-space:pre}
@keyframes comet{0%{stroke-dashoffset:8;opacity:0}12%{opacity:1}88%{opacity:1}100%{stroke-dashoffset:-92;opacity:0}}
@keyframes dots{to{stroke-dashoffset:-18}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes halo{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes ring{0%{opacity:.55;transform:scale(.85)}80%,100%{opacity:0;transform:scale(1.55)}}
@keyframes popin{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.comet{stroke-dasharray:8 92;stroke-dashoffset:8;opacity:0;animation:comet 3.2s cubic-bezier(.45,.05,.55,.95) infinite}
.dots{animation:dots 1.4s linear infinite}
@keyframes dotsm{to{stroke-dashoffset:-14.82}}
.dots-mark{animation:dotsm 1.6s linear infinite}
.breathe{animation:breathe 3.6s ease-in-out infinite}
.halo{animation:halo 4.8s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}
.pop{transform-box:fill-box;animation:popin .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadein .5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.comet{opacity:0}}
</style>
