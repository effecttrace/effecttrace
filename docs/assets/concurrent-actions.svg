<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="ca-title ca-desc">
<title id="ca-title">EffectTrace concurrent actions</title>
<desc id="ca-desc">Concurrent actions. Lane A: an agent calls restart_workload on shop/checkout; its graph keeps only Deployment shop/checkout, its ReplicaSet and Pods, and lists the payments change as excluded. Lane B: at the same moment a human runs kubectl scale on shop/payments, seen in the audit log with a pseudonymized user; its graph keeps only the payments Deployment, ReplicaSet and Pods. No edge crosses between the lanes. Bottom panel: two actions on the same workload; changes before the second request are attributed to the first action, while changes inside both actions' windows after the second request are AMBIGUOUS and attributed to neither.</desc>
<style>
